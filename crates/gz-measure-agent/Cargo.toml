[package]
name = "gz-measure-agent"
version.workspace = true
edition.workspace = true

[features]
intel = ["dep:evaluator-intel", "dep:runtime-intel"]

[[bin]]
name = "gz-measure-agent"
path = "src/main.rs"

[[bin]]
name = "gz-measure-smoke"
path = "src/bin/gz-measure-smoke.rs"

[[bin]]
name = "gz-compiler-measure-agent"
path = "src/bin/gz-compiler-measure-agent.rs"

[[bin]]
name = "gz-compiler-measure-smoke"
path = "src/bin/gz-compiler-measure-smoke.rs"

[dependencies]
artifact = { path = "../../../graphs/rust/artifact" }
blake3 = "1.8.5"
evaluator-nvidia = { path = "../../../graphs/rust/evaluator/targets/nvidia" }
evaluator-intel = { path = "../../../graphs/rust/evaluator/targets/intel", optional = true }
gz-engine = { path = "../gz-engine" }
gz-engine-compiler = { path = "../gz-engine-compiler" }
gz-engine-whittle = { path = "../gz-engine-whittle" }
gz-features = { path = "../gz-features" }
gz-measure-service = { path = "../gz-measure-service" }
gz-replay = { path = "../gz-replay" }
gz-search = { path = "../gz-search" }
pem = "3.0.6"
runtime-nvidia = { path = "../../../graphs/rust/runtime/targets/nvidia" }
runtime-intel = { path = "../../../graphs/rust/runtime/targets/intel", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.48.0", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.9.8"

[dev-dependencies]
rcgen = "0.14.8"
tempfile = "3.27.0"
