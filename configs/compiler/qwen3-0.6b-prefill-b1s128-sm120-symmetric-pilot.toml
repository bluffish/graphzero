[arch]
name = "gz-graph-v2"
dim = 128
layers = 4
heads = 4
ffn_dim = 512
dropout = 0.1
activation = "gelu"
aggregation = "attention"
global_tokens = 1
state_input = "joint-board"
trunk = "exphormer"
sage_layers = 3
policy_head = "pointer"
value_input = "single"
value_activation = "tanh"
subject_encoding = "mean"
position_encoding = "remaining_budget"
action_encoding = "kind_prior"
profile = "graphzero"
value_hidden = 0
value_head = "scalar"
value_bins = 101
value_min = -1.0
value_max = 1.0
value_sigma_ratio = 0.75
auxiliary_heads = "v8-v32-score"

[trainer]
optimizer = "adamw"
total_steps = 2
resume = false
lr = 0.0002
adamw_lr = 0.0002
lr_schedule = "constant"
warmup_steps = 0
min_lr_ratio = 0.0
batch = 1
value_batch = 1
window_rows = 128
value_window_rows = 128
publish_interval = 1
checkpoint_retain = 4
permanent_checkpoint_interval = 0
publish_lag_blocks = 0
value_weight = 1.0
value_trunk_grad_scale = 0.1
value_final_weight = 0.5
value_v8_weight = 0.2
value_v32_weight = 0.2
terminal_score_weight = 0.1
terminal_score_target = "log1p-cost-ms"
weight_decay = 0.0001
ema_decay = 0.0
grad_clip = 10.0
min_startup_rows = 1
seed = 42
model_seed = 5
data_seed = 42
device = "cuda:1"
startup_timeout = 900.0
reconnect_limit = 5
log_interval = 1
step_sleep = 0.0
min_available_gb = 20.0
prefetch = false
parallel_value_sampling = false
compile_model = false
compile_mode = "default"
matmul_precision = "high"
max_reuse = 0.0
reuse_gate_interval = 1
reuse_gate_episodes = 0
init_checkpoint = ""
init_checkpoint_scope = "all"

[selfplay]
lanes = 1
workers_per_lane = 1
simulations = 48
max_considered = 4
gumbel_scale = 1.0
c_visit = 50.0
c_scale = 1.0
gumbel_noise_overlap = 0.5
max_steps = 24
max_candidates = 1023
max_row_backlog = 1024
replay_retain = 1024
seed = 42
eval_device = "cuda:0"
eval_poll_interval = 2.0
max_batch = 8
python_dir = "python"
position_features = true
no_backtrack = true
mask_stop = false
eval_processes = 1
admission_stagger_ms = 0
admission_smoothing = false
tree_reuse = true

[engine]
kind = "compiler"
compiler_deployment = "configs/compiler/qwen3-0.6b-prefill-b1s128-sm120.toml"
compiler_max_nodes = 36352
compiler_max_edges = 46080
compiler_max_subjects = 24
measure_samples = 4

[measurement]
enabled = true
listen = "0.0.0.0:50051"
server_cert = "/opt/dlami/nvme/graphzero-measure-tls/bowen2/server.crt"
server_key = "/opt/dlami/nvme/graphzero-measure-tls/bowen2/server.key"
client_ca = "/opt/dlami/nvme/graphzero-measure-tls/bowen2/ca.crt"
agents = [
  "b02e0000000000000000000000000001=/opt/dlami/nvme/graphzero-measure-tls/bowen2/agent.crt",
]
receipt_dir = "/opt/dlami/nvme/graphzero-measure-receipts/qwen3-b1s128-symmetric-pilot-v2"
startup_timeout_ms = 900000

[paths]
run_dir = "/opt/dlami/nvme/graphzero-runs/qwen3-b1s128-symmetric-pilot-v2"
replay_dir = "/opt/dlami/nvme/graphzero-replay/qwen3-b1s128-symmetric-pilot-v2"
sample_socket = "/tmp/gz-qwen3-b1s128-symmetric-pilot-v2.sock"
graphzero_bin = "target/release/graphzero"
